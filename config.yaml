# Everything app- or model-specific lives here. To scan a different app, point `app` at its APK, or keep this file
# as is and pass an app file holding just an `app` section: python -m scanner run --app apps/androgoat.yaml

app:
  input_dir: target/decompiled         # jadx output (sources/ + resources/); this is what gets scanned
  apk: target/InsecureShop.apk         # optional: decompiled into input_dir when input_dir doesn't exist
  work_dir: work/insecureshop          # findings, lessons and report
  ground_truth: ground_truth/insecureshop.yaml

cache_dir: work/cache   # model replies, shared by all apps (keyed by model, prompt and app content)

# Models are written as <provider>/<model id>, where <provider> is an entry under `providers` below.

# Frontier model: scans the app once and writes the lessons.
# Options: anthropic/claude-haiku-5-5, anthropic/claude-sonnet-5-5, anthropic/claude-opus-5-5,
#   anthropic/claude-fable-5-1, openai/gpt-5.6-luna
teacher: anthropic/claude-haiku-5-5

# Open models: scan without and then with the teacher's lessons. List several to compare them.
# Options (free on OpenRouter): openrouter/google/gemma-4-26b-a4b-it:free, openrouter/google/gemma-4-31b-it:free,
#   openrouter/nvidia/nemotron-3.5-super-vl:free, openrouter/xingchen-agi/xing4.0-29b-a4b:free
#   Any id from https://openrouter.ai/models works; ones with structured output give the most reliable JSON.
# Options (Groq): groq/openai/gpt-oss-120b, groq/openai/gpt-oss-20b, groq/qwen/qwen3.8-27b
students: [openrouter/nvidia/nemotron-3.5-super-vl:free]

# Sorts every model's findings into `categories` for scoring; the same one for all runs.
# Options: anthropic/claude-haiku-5-5, anthropic/claude-sonnet-5-5
classifier: anthropic/claude-haiku-5-5

# USD per million input / output tokens, for the cost columns in the report.
# Not needed for OpenRouter models (OpenRouter reports each call's cost). Without a price, cost shows as unknown;
# on Groq's free tier, add the model with {input: 0, output: 0}.
prices:
  anthropic/claude-sonnet-5-5: {input: 2.00, output: 10.00}
  anthropic/claude-opus-5-5: {input: 4.00, output: 20.00}
  anthropic/claude-fable-5-1: {input: 10.00, output: 50.00}
  anthropic/claude-haiku-5-5: {input: 0.10, output: 0.50}

providers:
  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
  openai:
    type: openai_compatible
    api_key_env: OPENAI_API_KEY
    max_tokens_param: max_completion_tokens
  openrouter:
    type: openai_compatible
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    endpoints_url: https://openrouter.ai/api/v1/models/{model}/endpoints   # one model's providers and their supported_parameters
    extra_body:                            # sent with every request
      usage: {include: true}               # report each call's cost
      provider: {require_parameters: true} # route only to hosts that support the request's parameters (the schema)
  groq:
    type: openai_compatible
    api_key_env: GROQ_API_KEY
    base_url: https://api.groq.com/openai/v1

run:
  max_tokens: 16000        # per reply, for every model
  teacher_runs: 1          # the teacher step runs once; its findings and lessons are saved and reused
  student_runs: 3          # scans per student per condition; recall is reported as mean / min / max
  max_retries: 5           # per model call, with exponential backoff (free tiers rate-limit hard)
  parse_retries: 2         # extra attempts when a model returns unparseable JSON

ingest:
  # App code is the manifest's package. Add more here if an app keeps code elsewhere.
  extra_app_packages: []
  # Build-generated files that carry no app logic. (BuildConfig stays: apps often put keys there.)
  exclude_files: [R.java, BR.java, DataBinderMapperImpl.java, DataBindingInfo.java]
  exclude_dirs: [databinding]
  # Resources sent alongside the code (paths relative to jadx's resources/ folder).
  resource_globs:
    - res/values/strings.xml
    - res/xml/*.xml
  max_resource_bytes: 20000

match:
  # "file": a finding must point at the right file. "method": also the right method, when the answer key names one.
  location: file

# Bug types used for scoring. Scanning models never see this list; the classifier maps their findings onto it,
# and the answer key uses the same names, so types compare exactly.
categories:
  - hardcoded-secret
  - insecure-webview
  - url-validation
  - unsafe-intent-handling
  - exported-component
  - implicit-intent
  - insecure-broadcast-receiver
  - insecure-content-provider
  - insecure-file-provider
  - file-theft
  - insecure-data-storage
  - insecure-logging
  - ssl-validation
  - code-execution
  - vulnerable-dependency
  - cloud-misconfiguration
  - injection                # SQL, JavaScript/XSS, OS command
  - weak-crypto
  - insecure-configuration   # debuggable, backup, cleartext traffic, trusted user CAs
  - other
