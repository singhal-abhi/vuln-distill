# AndroGoat ground truth (v2.0.1 release APK, sha256 3e6f6b538b82874dd94c0d8cdadd69ba54d49b59d2c7eb055073892e8a4fc0e0).
# Used only to score results; it is never shown to any model. Written before any model scanned this app.
#
# Source: the challenge list in https://github.com/satishpatnayak/AndroGoat#readme, with each location found in
# the decompiled release. A finding matches an entry when its category is one of `categories` AND its file is one
# of `locations`. Paths are as the models see them.
#
# Judgement calls:
# - Left out (runtime bypasses of a protection, with no weakness to point at in code): Root Detection, Emulator
#   Detection, Certificate Pinning (OkHttp3), Certificate Pinning (Network Security Config), Binary Patching.
# - Left out: Misconfigured Firebase DB. No Firebase URL or config exists anywhere in this build.
# - Merged: "Unprotected Activity" and "Custom URL Scheme" are the same exported deep-link activity (#12).
# - Merged: "Network Intercepting: HTTPS" and "Misconfigured network_security_config.xml" are the same setting,
#   trusting user-installed CAs (#21).
# - Added: OS command injection (#26). The app ships a challenge activity for it, but the README list omits it.
# - #6 Keyboard Cache lives in a layout's inputType, and layouts are not sent to the models, so it is very hard to
#   find from what the scan sees. Kept anyway: the ground truth should not bend to the scanner.

vulnerabilities:
  - id: 1
    name: "Insecure Data Storage: Shared Prefs 1"   # username and password saved in plain SharedPreferences
    categories: [insecure-data-storage]
    locations:
      - {file: owasp/sat/agoat/InsecureStorageSharedPrefs.java}

  - id: 2
    name: "Insecure Data Storage: Shared Prefs 2"   # game score kept in SharedPreferences, trivially tampered
    categories: [insecure-data-storage]
    locations:
